<!doctype html>
<!--
  Live arena viewer — dev-only, served by `pnpm dev`, never shipped (Vite's
  production build only takes index.html as an entry).

    http://localhost:5173/arena.html#bustervalley

  Full-window on purpose: Pixi sizes its canvas to the window, so a boxed stage
  would crop the render and put the camera centre somewhere off screen.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gem Rush — arena</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #12151c; }
      #stage { position: fixed; inset: 0; }
      .controls {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 14px;
        align-items: center;
        background: rgba(13, 17, 25, 0.85);
        border: 1px solid #2a3342;
        border-radius: 8px;
        padding: 8px 12px;
        color: #e6e9ef;
        font: 12px ui-monospace, monospace;
      }
      select {
        background: #1d2431;
        color: #e6e9ef;
        border: 1px solid #2a3342;
        padding: 5px 8px;
        border-radius: 4px;
        font: 12px ui-monospace, monospace;
      }
      a { color: #4da3ff; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="controls">
      <select id="map"></select>
      <label>mine charge <input id="charge" type="range" min="0" max="1" step="0.05" value="0" /></label>
      <a href="/arenas.html">all layouts</a>
    </div>
    <script type="module" src="/src/dev/arenaView.ts"></script>
  </body>
</html>
