# Build the client and publish it to GitHub Pages.
#
# Only the client is deployed: the game is hosted from a player's browser over
# WebRTC, so there is no server to run. Pages serves static files and that is
# all this needs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-finished deploy is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck and test before publishing: Pages has no staging environment,
      # so a broken push is live immediately.
      - run: pnpm -r typecheck
      - run: pnpm test

      - run: pnpm --filter @gem-rush/client build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The default 10 minutes is not enough for the first deploys after a
          # Pages site is created: deployments sit in `deployment_queued` while
          # the backend settles, the action aborts, and the artifact is built
          # but never published.
          timeout: 1200000
